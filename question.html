<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quad-bench question</title>
<style>
  body { font: 1.25rem/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  fieldset { border: 1px solid #8884; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
  legend { font-weight: 600; padding: 0 .5rem; }
  img { display: block; width: 100%; max-width: 320px; margin: 0 auto 1rem; background: #fff; border-radius: 8px; }
  label { display: block; padding: .5rem .75rem; border-radius: 8px; cursor: pointer; }
  label:hover { background: #8882; }
  label:has(input:checked) { background: #4a90e233; }
  input { width: 1.2em; height: 1.2em; vertical-align: -.15em; margin-right: .5rem; }
</style>

<!-- Same question as PROMPT in bench.py. -->
<fieldset>
  <legend>Look at the shape in the image. Which of the following is it?</legend>
  <img src="images/square.png" alt="A square">
  <label><input type="radio" name="square"> a) square</label>
  <label><input type="radio" name="square"> b) rectangle</label>
  <label><input type="radio" name="square"> c) parallelogram</label>
  <label><input type="radio" name="square"> d) rhombus</label>
  <label><input type="radio" name="square"> e) kite</label>
  <label><input type="radio" name="square"> f) all of the above</label>
  <label><input type="radio" name="square"> g) none of the above</label>
</fieldset>

<fieldset>
  <legend>Look at the shape in the image. Which of the following is it?</legend>
  <img src="images/square_rotated45.png" alt="A square rotated 45 degrees">
  <label><input type="radio" name="rotated"> a) square</label>
  <label><input type="radio" name="rotated"> b) rectangle</label>
  <label><input type="radio" name="rotated"> c) parallelogram</label>
  <label><input type="radio" name="rotated"> d) rhombus</label>
  <label><input type="radio" name="rotated"> e) kite</label>
  <label><input type="radio" name="rotated"> f) all of the above</label>
  <label><input type="radio" name="rotated"> g) none of the above</label>
</fieldset>
</html>
